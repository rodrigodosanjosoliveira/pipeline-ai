<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Pipeline Circuit Nodes & Connectors -->
  <g filter="url(#shadow)">
    <!-- Main flow line 1 -->
    <path d="M 120 256 L 200 256 L 256 160 L 336 160" fill="none" stroke="url(#pipeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Main flow line 2 -->
    <path d="M 200 256 L 256 352 L 336 352 L 392 256" fill="none" stroke="url(#pipeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Convergence Line -->
    <path d="M 336 160 L 392 256" fill="none" stroke="url(#pipeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodes -->
    <!-- Input Node -->
    <circle cx="120" cy="256" r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="8"/>
    <circle cx="120" cy="256" r="8" fill="#38bdf8"/>

    <!-- Fork Node -->
    <circle cx="200" cy="256" r="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="6"/>
    <circle cx="200" cy="256" r="6" fill="#38bdf8"/>

    <!-- Upper Branch Node (Guardrails/Analysis) -->
    <circle cx="256" cy="160" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="6"/>
    <circle cx="256" cy="160" r="7" fill="#60a5fa"/>

    <circle cx="336" cy="160" r="18" fill="#0f172a" stroke="#6366f1" stroke-width="6"/>
    <circle cx="336" cy="160" r="7" fill="#818cf8"/>

    <!-- Lower Branch Node (Dev/Execution) -->
    <circle cx="256" cy="352" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="6"/>
    <circle cx="256" cy="352" r="7" fill="#60a5fa"/>

    <circle cx="336" cy="352" r="18" fill="#0f172a" stroke="#8b5cf6" stroke-width="6"/>
    <circle cx="336" cy="352" r="7" fill="#a78bfa"/>

    <!-- Target / Delivery Core Node -->
    <circle cx="392" cy="256" r="28" fill="#0f172a" stroke="#a855f7" stroke-width="9"/>
    <circle cx="392" cy="256" r="12" fill="#c084fc"/>
  </g>

  <!-- Central Autonomous Spark / Diamond -->
  <polygon points="256,220 280,256 256,292 232,256" fill="url(#glowGrad)"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
