<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pipeline-ai // Guia Interativo Step-by-Step</title>
  <meta name="description" content="Guia interativo step-by-step sobre governança determinística, bounded output, dual-audience CLI, Gemini 4 Hydrogen tiers e telemetria DORA no pipeline-ai." />
  <style>
    :root {
      --bg: #f7f4ee;
      --bg-card: #efeae0;
      --bg-elevated: #fbf9f5;
      --bg-code: #e7e1d5;
      --text: #1f1d1a;
      --text-muted: #5c564c;
      --text-subtle: #7d7568;
      --border: #d9d2c5;
      --border-strong: #c5bcac;
      --shadow-sm: 0 1px 2px rgba(31, 29, 26, 0.05), 0 4px 12px rgba(31, 29, 26, 0.04);
      --shadow-md: 0 6px 24px rgba(31, 29, 26, 0.08);
      --shadow-lg: 0 16px 48px rgba(31, 29, 26, 0.14);

      --sage: #2f8f6b;
      --sage-soft: rgba(47, 143, 107, 0.12);
      --lavender: #7c6fd6;
      --lavender-soft: rgba(124, 111, 214, 0.12);
      --blue: #3b82c4;
      --blue-soft: rgba(59, 130, 196, 0.12);
      --amber: #d4832a;
      --amber-soft: rgba(212, 131, 42, 0.14);
      --coral: #d14d41;
      --coral-soft: rgba(209, 77, 65, 0.12);

      --grid-line: rgba(31, 29, 26, 0.06);
      --svg-node-bg: #fbf9f5;
      --svg-node-stroke: #c5bcac;

      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --radius: 10px;
      --radius-sm: 6px;
      --topbar-h: 58px;
    }

    [data-theme="dark"] {
      --bg: #211e1a;
      --bg-card: #2b2722;
      --bg-elevated: #322d27;
      --bg-code: #1a1714;
      --text: #f3efe6;
      --text-muted: #c2b9ab;
      --text-subtle: #968d7f;
      --border: #3e3830;
      --border-strong: #534b40;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 20px 56px rgba(0, 0, 0, 0.55);

      --sage: #45b389;
      --sage-soft: rgba(69, 179, 137, 0.16);
      --lavender: #9c91eb;
      --lavender-soft: rgba(156, 145, 235, 0.16);
      --blue: #5da3e5;
      --blue-soft: rgba(93, 163, 229, 0.16);
      --amber: #ea9c46;
      --amber-soft: rgba(234, 156, 70, 0.16);
      --coral: #e86b60;
      --coral-soft: rgba(232, 107, 96, 0.16);

      --grid-line: rgba(243, 239, 230, 0.05);
      --svg-node-bg: #2b2722;
      --svg-node-stroke: #534b40;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }

    a { color: inherit; text-decoration: none; }

    /* Top Bar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 40;
      gap: 12px;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
    }

    .icon-btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-card);
    }

    .icon-btn:active { transform: translateY(1px); }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 0 3px var(--sage-soft);
    }

    .brand-sep { color: var(--text-subtle); font-weight: 400; }
    .brand-sub { color: var(--lavender); font-weight: 600; }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 5px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text-muted);
      line-height: 1.3;
    }

    .progress-pill {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-mini {
      width: 56px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-bar-mini > span {
      display: block;
      height: 100%;
      background: var(--sage);
      transition: width 0.25s ease;
    }

    @media (min-width: 820px) {
      .progress-pill { display: inline-flex; }
    }

    /* Main Workspace */
    .workspace {
      padding-top: var(--topbar-h);
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(320px, 1fr);
      max-width: 1520px;
      margin: 0 auto;
    }

    .stage-col {
      padding: 24px 28px 36px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .narrative-col {
      padding: 24px 24px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg);
    }

    @media (max-width: 1040px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .stage-col {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 18px 16px 24px;
      }
      .narrative-col {
        padding: 18px 16px 32px;
      }
    }

    /* Stage Header */
    .breadcrumb {
      font-size: 12px;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .breadcrumb-tag {
      color: var(--sage);
      font-weight: 600;
    }

    .lesson-title {
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-weight: 700;
      margin-top: 4px;
    }

    .lesson-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Live Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 600px) {
      .metrics-grid { grid-template-columns: 1fr; }
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .metric-delta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tone-sage { color: var(--sage); }
    .tone-lavender { color: var(--lavender); }
    .tone-blue { color: var(--blue); }
    .tone-amber { color: var(--amber); }
    .tone-coral { color: var(--coral); }

    /* SVG Stage Canvas */
    .canvas-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .canvas-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      gap: 10px;
      flex-wrap: wrap;
    }

    .canvas-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);
      animation: pulse 1.8s infinite;
    }

    .canvas-card.paused .live-dot {
      background: var(--amber);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .canvas-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .svg-wrap {
      position: relative;
      width: 100%;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
      padding: 10px;
    }

    .svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .canvas-card.paused svg * {
      animation-play-state: paused !important;
    }

    /* SVG Helpers */
    .flow-dash {
      stroke-dasharray: 6 6;
      animation: dashFlow 1.4s linear infinite;
    }

    .flow-dash-slow {
      stroke-dasharray: 5 5;
      animation: dashFlow 2.4s linear infinite;
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }

    .node-pulse {
      animation: nodeGlow 2.2s ease-in-out infinite;
    }

    @keyframes nodeGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.7; }
    }

    /* Stepper */
    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-pill {
      flex: 1;
      min-width: 96px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .step-pill:hover {
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    .step-pill.active {
      border-color: var(--sage);
      background: var(--sage-soft);
      font-weight: 700;
    }

    .step-pill.done:not(.active) {
      border-color: var(--border-strong);
    }

    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .step-pill.active .step-num {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }

    .step-pill.done:not(.active) .step-num {
      color: var(--sage);
      border-color: var(--sage);
    }

    .step-pill-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Narrative Panel */
    .step-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step-counter {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-subtle);
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }

    .badge-PROBLEM { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
    .badge-SETUP { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }
    .badge-TECHNIQUE { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
    .badge-INSIGHT { background: var(--lavender-soft); color: var(--lavender); border-color: var(--lavender); }
    .badge-RECAP { background: var(--sage-soft); color: var(--sage); border-color: var(--sage); }

    .step-heading {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .step-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .step-body code {
      background: var(--bg-code);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
    }

    /* Key Idea Card */
    .key-idea {
      background: var(--lavender-soft);
      border: 1px solid var(--lavender);
      border-left: 4px solid var(--lavender);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .key-idea-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--lavender);
      margin-bottom: 4px;
    }

    .key-idea-text {
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.55;
    }

    /* What Changed Diff */
    .diff-box {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .diff-header {
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .diff-lines {
      padding: 8px 0;
      font-size: 12px;
      line-height: 1.55;
    }

    .diff-line {
      padding: 2px 12px;
      display: flex;
      gap: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .diff-line.del { background: var(--coral-soft); color: var(--coral); }
    .diff-line.mod { background: var(--amber-soft); color: var(--amber); }
    .diff-line.add { background: var(--sage-soft); color: var(--sage); }

    .diff-sigil { font-weight: 700; flex-shrink: 0; }

    /* Learning Checklist */
    .checklist-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .checklist-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
      margin-bottom: 8px;
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .checklist li.checked { color: var(--text); }

    .check-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
      background: var(--bg);
    }

    .checklist li.checked .check-icon {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }

    /* Nav Footer */
    .nav-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--border-strong);
      background: var(--bg-card);
    }

    .nav-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .nav-btn.primary {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }

    .nav-btn.primary:hover:not(:disabled) {
      filter: brightness(1.06);
      background: var(--sage);
    }

    .shortcuts-hint {
      font-size: 11px;
      color: var(--text-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    /* Drawer */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 13, 11, 0.5);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: min(360px, 90vw);
      background: var(--bg);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 70;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open { transform: translateX(0); }

    @media (min-width: 1121px) {
      .drawer {
        top: var(--topbar-h);
        width: 276px;
        transform: translateX(0);
        box-shadow: none;
        z-index: 30;
      }
      body.sidebar-collapsed .drawer {
        transform: translateX(-100%);
      }
      .drawer-header .icon-btn {
        display: none;
      }
      .workspace {
        margin-left: 276px;
        max-width: calc(100vw - 276px);
        transition: margin-left 0.22s ease, max-width 0.22s ease;
      }
      body.sidebar-collapsed .workspace {
        margin-left: 0;
        max-width: 1520px;
        margin-right: auto;
      }
    }

    .drawer-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-progress {
      padding: 14px 18px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    .drawer-progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .drawer-progress-bar {
      height: 7px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .drawer-progress-bar > span {
      display: block;
      height: 100%;
      background: var(--sage);
      transition: width 0.25s ease;
    }

    .drawer-list {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .lesson-item {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .lesson-item:hover {
      border-color: var(--border-strong);
      background: var(--bg-card);
    }

    .lesson-item.active {
      border-color: var(--sage);
      background: var(--sage-soft);
    }

    .lesson-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-subtle);
    }

    .lesson-item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .lesson-item-desc {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .done-tag {
      color: var(--sage);
      font-weight: 700;
    }

    /* Search Modal */
    .search-modal {
      position: fixed;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%) scale(0.97);
      width: min(620px, 92vw);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      overflow: hidden;
    }

    .search-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);

      // SVG Diagram Builder (viewBox 0 0 720 360)
      function svgBox(x, y, w, h, title, sub, accent) {
        const stroke = accent ? `var(--${accent})` : "var(--svg-node-stroke)";
        const bg = accent ? `var(--${accent}-soft)` : "var(--svg-node-bg)";
        const titleColor = accent ? `var(--${accent})` : "var(--text)";
        return `
          <g>
            <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${bg}" stroke="${stroke}" stroke-width="1.6"/>
            <text x="${x + w / 2}" y="${y + (sub ? h / 2 - 4 : h / 2 + 4)}" text-anchor="middle" fill="${titleColor}" font-size="12.5" font-weight="700">${title}</text>
            ${sub ? `<text x="${x + w / 2}" y="${y + h / 2 + 13}" text-anchor="middle" fill="var(--text-muted)" font-size="10.5">${sub}</text>` : ""}
          </g>
        `;
      }

      function svgPacket(pathId, color, dur, begin) {
        return `
          <circle r="4.5" fill="var(--${color})">
            <animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite">
              <mpath href="#${pathId}"/>
            </animateMotion>
          </circle>
        `;
      }

          case "dora-4":

              <path id="p-s4c" d="M 445 205 L 530 240" fill="none" stroke="var(--lavender)" stroke-width="2" class="flow-dash"/>
              ${svgPacket("p-s4a", "sage", 1.7, 0)}
              ${svgPacket("p-s4b", "blue", 1.7, 0.4)}

              ${svgBox(30, 140, 155, 80, "pipeline-ai run", "telemetria passiva", "sage")}

      }

      // State
      let state = {
        lessonIdx: 0,
        stepIdx: 0,
        paused: false,
        completedLessons: new Set()
      };

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_PROGRESS);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) state.completedLessons = new Set(parsed);
          }
        } catch (_) {}
      }

      function saveProgress() {
        try {
          localStorage.setItem(STORAGE_PROGRESS, JSON.stringify([...state.completedLessons]));
        } catch (_) {}
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.getElementById("themeIcon").textContent = theme === "dark" ? "☀" : "☾";
        try { localStorage.setItem(STORAGE_THEME, theme); } catch (_) {}
      }

      function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(STORAGE_THEME); } catch (_) {}
        applyTheme(saved === "dark" ? "dark" : "light");
      }

      function parseHash() {
        const hash = window.location.hash.replace(/^#\/?/, "");
        if (!hash) return;
        const [lessonId, stepNum] = hash.split("/");
        const lIdx = LESSONS.findIndex(l => l.id === lessonId);
        if (lIdx !== -1) {
          state.lessonIdx = lIdx;
          const s = parseInt(stepNum, 10) - 1;
          if (!isNaN(s) && s >= 0 && s < LESSONS[lIdx].steps.length) {
            state.stepIdx = s;
          } else {
            state.stepIdx = 0;
          }
        }
      }

      function syncHash() {
        const lesson = LESSONS[state.lessonIdx];
        const target = `#/${lesson.id}/${state.stepIdx + 1}`;
        if (window.location.hash !== target) {
          history.replaceState(null, "", target);
        }
      }

      function updateProgressUI() {
        const count = state.completedLessons.size;
        const total = LESSONS.length;
        const pct = Math.round((count / total) * 100);
        document.getElementById("topProgressText").textContent = `Progresso (${count} / ${total})`;
        document.getElementById("topProgressBar").style.width = `${pct}%`;
        document.getElementById("drawerProgressText").textContent = `${count} / ${total} concluídas`;
        document.getElementById("drawerProgressBar").style.width = `${pct}%`;
      }

      function renderDrawer() {
        const list = document.getElementById("drawerList");
        list.innerHTML = LESSONS.map((lesson, idx) => {
          const active = idx === state.lessonIdx ? "active" : "";
          const done = state.completedLessons.has(lesson.id);
          return `
            <button class="lesson-item ${active}" data-lesson="${idx}">
              <div class="lesson-item-top">
                <span>${lesson.module}</span>
                ${done ? `<span class="done-tag">✓ concluída</span>` : `<span>${lesson.steps.length} steps</span>`}
              </div>
              <div class="lesson-item-title">${idx + 1}. ${lesson.title}</div>
              <div class="lesson-item-desc">${lesson.subtitle}</div>
            </button>
          `;
        }).join("");

        list.querySelectorAll(".lesson-item").forEach(btn => {
          btn.addEventListener("click", () => {
            goTo(parseInt(btn.dataset.lesson, 10), 0);
            closeModals();
          });
        });
      }

      function render() {
        const lesson = LESSONS[state.lessonIdx];
        const step = lesson.steps[state.stepIdx];

        if (state.stepIdx === lesson.steps.length - 1) {
          state.completedLessons.add(lesson.id);
          saveProgress();
        }

        syncHash();
        updateProgressUI();

        document.getElementById("breadcrumbModule").textContent = lesson.module;
        document.getElementById("breadcrumbLesson").textContent = `Lição ${state.lessonIdx + 1} de ${LESSONS.length}`;
        document.getElementById("lessonTitle").textContent = lesson.title;
        document.getElementById("lessonSubtitle").textContent = lesson.subtitle;

        // Metrics
        document.getElementById("metricsGrid").innerHTML = step.metrics.map(m => `
          <div class="metric-card">
            <div class="metric-label">${m.label}</div>
            <div class="metric-value tone-${m.tone}">${m.value}</div>
            <div class="metric-delta">${m.delta}</div>
          </div>
        `).join("");

        // SVG Stage
        document.getElementById("canvasCaption").textContent = step.caption;
        document.getElementById("svgStage").innerHTML = renderDiagram(step.diagram);
        document.getElementById("canvasCard").classList.toggle("paused", state.paused);
        document.getElementById("playPauseLabel").textContent = state.paused ? "▶ Retomar" : "⏸ Pausar";

        // Stepper
        document.getElementById("stepper").innerHTML = lesson.steps.map((s, idx) => {
          const cls = idx === state.stepIdx ? "active" : idx < state.stepIdx ? "done" : "";
          return `
            <button class="step-pill ${cls}" data-step="${idx}">
              <span class="step-num">${idx < state.stepIdx ? "✓" : idx + 1}</span>
              <span class="step-pill-label">${s.short}</span>
            </button>
          `;
        }).join("");

        document.querySelectorAll(".step-pill").forEach(btn => {
          btn.addEventListener("click", () => goTo(state.lessonIdx, parseInt(btn.dataset.step, 10)));
        });

        // Narrative
        document.getElementById("stepCounter").textContent = `STEP ${state.stepIdx + 1} / ${lesson.steps.length}`;
        const badgeEl = document.getElementById("stepBadge");
        badgeEl.textContent = step.badge;
        badgeEl.className = `badge badge-${step.badge}`;

        document.getElementById("stepHeading").textContent = step.heading;
        document.getElementById("stepBody").innerHTML = step.body;
        document.getElementById("keyIdeaText").textContent = step.keyIdea;

        // Diff
        document.getElementById("diffLines").innerHTML = step.diff.map(d => {
          const sigil = d.t === "del" ? "-" : d.t === "mod" ? "~" : "+";
          return `<div class="diff-line ${d.t}"><span class="diff-sigil">${sigil}</span><span>${d.text}</span></div>`;
        }).join("");

        // Checklist
        document.getElementById("checklist").innerHTML = lesson.checklist.map((item, idx) => {
          const checked = idx <= state.stepIdx;
          return `
            <li class="${checked ? "checked" : ""}">
              <span class="check-icon">${checked ? "✓" : ""}</span>
              <span>${item}</span>
            </li>
          `;
        }).join("");

        // Nav buttons
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        prevBtn.disabled = state.lessonIdx === 0 && state.stepIdx === 0;

        const isLastStep = state.stepIdx === lesson.steps.length - 1;
        const isLastLesson = state.lessonIdx === LESSONS.length - 1;
        if (isLastStep && !isLastLesson) {
          nextBtn.textContent = `Próxima lição →`;
        } else if (isLastStep && isLastLesson) {
          nextBtn.textContent = `Reiniciar guia ↻`;
        } else {
          nextBtn.textContent = `Próximo →`;
        }

        renderDrawer();
      }

      function goTo(lessonIdx, stepIdx) {
        state.lessonIdx = lessonIdx;
        state.stepIdx = stepIdx;
        render();
      }

      function next() {
        const lesson = LESSONS[state.lessonIdx];
        if (state.stepIdx < lesson.steps.length - 1) {
          state.stepIdx++;
        } else if (state.lessonIdx < LESSONS.length - 1) {
          state.lessonIdx++;
          state.stepIdx = 0;
        } else {
          state.lessonIdx = 0;
          state.stepIdx = 0;
        }
        render();
      }

      function prev() {
        if (state.stepIdx > 0) {
          state.stepIdx--;
        } else if (state.lessonIdx > 0) {
          state.lessonIdx--;
          state.stepIdx = LESSONS[state.lessonIdx].steps.length - 1;
        }
        render();
      }

      function replay() {
        const lesson = LESSONS[state.lessonIdx];
        const step = lesson.steps[state.stepIdx];
        state.paused = false;
        document.getElementById("canvasCard").classList.remove("paused");
        document.getElementById("playPauseLabel").textContent = "⏸ Pausar";
        document.getElementById("svgStage").innerHTML = renderDiagram(step.diagram);
      }

      // Modals & Search
      const overlay = document.getElementById("overlay");
      const drawer = document.getElementById("drawer");
      const searchModal = document.getElementById("searchModal");
      const searchInput = document.getElementById("searchInput");

      function openDrawer() {
        closeModals();
        overlay.classList.add("open");
        drawer.classList.add("open");
      }

      function openSearch() {
        closeModals();
        overlay.classList.add("open");
        searchModal.classList.add("open");
        searchInput.value = "";
        renderSearchResults("");
        setTimeout(() => searchInput.focus(), 30);
      }

      function closeModals() {
        overlay.classList.remove("open");
        drawer.classList.remove("open");
        searchModal.classList.remove("open");
      }

      function renderSearchResults(query) {
        const q = query.trim().toLowerCase();
        const items = [];
        LESSONS.forEach((lesson, lIdx) => {
          lesson.steps.forEach((step, sIdx) => {
            const hay = `${lesson.title} ${lesson.subtitle} ${step.heading} ${step.body} ${step.keyIdea}`.toLowerCase();
            if (!q || hay.includes(q)) {
              items.push({ lIdx, sIdx, lesson, step });
            }
          });
        });

        const container = document.getElementById("searchResults");
        if (!items.length) {
          container.innerHTML = `<div class="search-empty">Nenhum resultado para "${query}".</div>`;
          return;
        }

        container.innerHTML = items.slice(0, 12).map(it => `
          <button class="search-result" data-l="${it.lIdx}" data-s="${it.sIdx}">
            <span class="search-result-meta">${it.lesson.module} · Step ${it.sIdx + 1} (${it.step.badge})</span>
            <span class="search-result-title">${it.step.heading}</span>
            <span class="search-result-snippet">${it.step.keyIdea}</span>
          </button>
        `).join("");

        container.querySelectorAll(".search-result").forEach(btn => {
          btn.addEventListener("click", () => {
            goTo(parseInt(btn.dataset.l, 10), parseInt(btn.dataset.s, 10));
            closeModals();
          });
        });
      }

      // Event Listeners
      document.getElementById("drawerBtn").addEventListener("click", () => {
        if (window.innerWidth >= 1121) {
          document.body.classList.toggle("sidebar-collapsed");
        } else {
          openDrawer();
        }
      });
      document.getElementById("closeDrawerBtn").addEventListener("click", closeModals);
      document.getElementById("searchBtn").addEventListener("click", openSearch);
      overlay.addEventListener("click", closeModals);
      searchInput.addEventListener("input", e => renderSearchResults(e.target.value));

      document.getElementById("themeBtn").addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        applyTheme(current === "dark" ? "light" : "dark");
      });

      document.getElementById("playPauseBtn").addEventListener("click", () => {
        state.paused = !state.paused;
        document.getElementById("canvasCard").classList.toggle("paused", state.paused);
        document.getElementById("playPauseLabel").textContent = state.paused ? "▶ Retomar" : "⏸ Pausar";
      });

      document.getElementById("replayBtn").addEventListener("click", replay);
      document.getElementById("prevBtn").addEventListener("click", prev);
      document.getElementById("nextBtn").addEventListener("click", next);

      window.addEventListener("hashchange", () => {
        parseHash();
        render();
      });

      document.addEventListener("keydown", e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          if (searchModal.classList.contains("open")) closeModals();
          else openSearch();
          return;
        }
        if (e.key === "Escape") {
          closeModals();
          return;
        }
        if (document.activeElement === searchInput) return;

        if (e.key === "ArrowRight") { e.preventDefault(); next(); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
        else if (e.key === " ") {
          e.preventDefault();
          state.paused = !state.paused;
          document.getElementById("canvasCard").classList.toggle("paused", state.paused);
          document.getElementById("playPauseLabel").textContent = state.paused ? "▶ Retomar" : "⏸ Pausar";
        } else if (e.key.toLowerCase() === "r") {
          e.preventDefault();
          replay();
        }
      });

      // Init
      initTheme();
      loadProgress();
      parseHash();
      render();
    })();
  </script>
